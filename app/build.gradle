plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.citroensplash'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.citroensplash"
        // minSdk 21 covers Android 5.0+, which includes the vast majority of
        // aftermarket and OEM Android automotive head units in the field.
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    // Deliberately minimal: only AppCompat for theming. No heavy libraries,
    // no background services, no analytics — keeps the app's footprint
    // small so it has no measurable impact on boot time.
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
}
